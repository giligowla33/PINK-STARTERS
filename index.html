<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STARTERS 夢幻單字闖關地圖</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg-top: #ffeef6;
      --bg-mid: #f5f0ff;
      --bg-bot: #eef9ff;
      --card: #ffffff;
      --pink: #ff6fa5;
      --pink-dark: #e84c88;
      --purple: #9b6bff;
      --mint: #2ec4b6;
      --gold: #ffb703;
      --success: #22c55e;
      --success-bg: #dcfce7;
      --danger: #f43f5e;
      --danger-bg: #ffe4e6;
      --warning: #f59e0b;
      --warning-bg: #fef3c7;
      --text: #3b2d4a;
      --muted: #7c6f8c;
      --border: #f3d9e7;
      --radius: 22px;
      --shadow: 0 10px 28px rgba(180, 95, 145, 0.14);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: "Quicksand", "Nunito", "Noto Sans TC", "PingFang TC", sans-serif;
      background:
        radial-gradient(circle at 12% 10%, #ffd6e8 0%, transparent 32%),
        radial-gradient(circle at 88% 18%, #e0d4ff 0%, transparent 34%),
        radial-gradient(circle at 50% 85%, #d6f5ff 0%, transparent 40%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--border);
      padding: 12px 16px;
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.18rem;
      color: var(--pink-dark);
      cursor: pointer;
    }
    .brand-icon {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      box-shadow: 0 4px 12px rgba(255, 111, 165, 0.3);
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.98rem;
      font-weight: 800;
      min-height: 44px;
      transition: transform 0.14s ease, box-shadow 0.14s ease, background-color 0.15s ease;
    }
    button:active { transform: scale(0.96); }
    .btn-pink {
      background: linear-gradient(135deg, var(--pink), #ff8fb8);
      color: #fff;
      box-shadow: 0 6px 16px rgba(255, 111, 165, 0.32);
    }
    .btn-pink:hover { filter: brightness(1.04); transform: translateY(-1px); }
    .btn-purple {
      background: linear-gradient(135deg, var(--purple), #b388ff);
      color: #fff;
      box-shadow: 0 6px 16px rgba(155, 107, 255, 0.28);
    }
    .btn-mint {
      background: linear-gradient(135deg, var(--mint), #5ce1d6);
      color: #fff;
      box-shadow: 0 6px 16px rgba(46, 196, 182, 0.28);
    }
    .btn-soft {
      background: #fff;
      color: var(--text);
      border: 2px solid var(--border);
    }
    .btn-soft:hover { background: #fff7fb; border-color: var(--pink); }
    .btn-sm { padding: 7px 14px; font-size: 0.9rem; min-height: 38px; }
    .container { max-width: 960px; margin: 0 auto; padding: 20px 16px 70px; }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      border: 2px solid var(--border);
      margin-bottom: 20px;
    }
    .map-hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      background: linear-gradient(135deg, #fff5fa 0%, #f6f0ff 100%);
    }
    .map-hero h1 { margin: 0 0 6px; font-size: 1.52rem; color: var(--text); }
    .map-hero p { margin: 0; color: var(--muted); font-weight: 600; }
    .star-badge {
      background: #fff;
      border: 2px solid #ffe082;
      color: #b45309;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(255, 183, 3, 0.18);
    }
    .road-map-wrapper {
      position: relative;
      background: linear-gradient(180deg, #e8f8ee 0%, #f4f9ff 35%, #fff3f8 70%, #f6efff 100%);
      border: 3px solid #f7cde0;
      border-radius: 30px;
      padding: 28px 16px 40px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .road-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .road-nodes-list {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 22px;
      max-width: 720px;
      margin: 0 auto;
    }
    .road-row { display: flex; align-items: center; width: 100%; position: relative; }
    .road-row.pos-left { justify-content: flex-start; padding-left: 4%; }
    .road-row.pos-center { justify-content: center; }
    .road-row.pos-right { justify-content: flex-end; padding-right: 4%; }
    .road-station {
      width: 270px;
      max-width: 82%;
      background: #fff;
      border: 3.5px solid #ff9ec4;
      border-radius: 26px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(232, 76, 136, 0.16);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      position: relative;
    }
    .road-station:hover {
      transform: scale(1.04) translateY(-2px);
      border-color: var(--pink-dark);
      box-shadow: 0 14px 28px rgba(232, 76, 136, 0.25);
    }
    .road-station.cleared {
      border-color: #34d399;
      background: linear-gradient(135deg, #ffffff 0%, #ecfdf5 100%);
    }
    .road-station.next-target {
      border-color: var(--gold);
      box-shadow: 0 0 0 5px rgba(255, 183, 3, 0.25), 0 12px 24px rgba(232, 76, 136, 0.2);
    }
    .station-circle {
      width: 52px;
      height: 52px;
      min-width: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      font-weight: 900;
      font-size: 1.05rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      box-shadow: 0 4px 10px rgba(155, 107, 255, 0.3);
    }
    .road-station.cleared .station-circle {
      background: linear-gradient(135deg, #22c55e, #10b981);
    }
    .station-info { flex: 1; min-width: 0; }
    .station-title {
      font-weight: 800;
      font-size: 0.96rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .station-meta { font-size: 0.82rem; color: var(--muted); font-weight: 700; margin-top: 2px; }
    .avatar-pin {
      position: absolute;
      top: -16px;
      right: 14px;
      background: var(--gold);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 2px 10px;
      border-radius: 999px;
      box-shadow: 0 4px 10px rgba(245, 158, 11, 0.35);
      animation: bounce 1.4s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .scenery-deco { position: absolute; font-size: 1.7rem; pointer-events: none; opacity: 0.85; }
    .stage-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .step-pill {
      display: inline-block;
      background: #fff0f6;
      color: var(--pink-dark);
      border: 1.5px solid #ffc2dc;
      font-weight: 800;
      font-size: 0.86rem;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .review-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .vocab-card {
      background: #fff;
      border: 2px solid #f5d8e8;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 6px 16px rgba(155, 107, 255, 0.06);
    }
    .vocab-zh { font-size: 1.25rem; font-weight: 800; color: var(--text); }
    .vocab-en { font-size: 1.15rem; font-weight: 800; color: var(--pink-dark); word-break: break-word; }
    .progress-track {
      width: 100%;
      height: 12px;
      background: #fce7f3;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0 18px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--pink), var(--purple));
      transition: width 0.25s ease;
    }
    .quiz-center { text-align: center; }
    .zh-prompt-box {
      background: linear-gradient(135deg, #fff7fb 0%, #f6f1ff 100%);
      border: 2px dashed #f3b8d6;
      border-radius: 22px;
      padding: 18px 16px;
      margin: 10px 0 16px;
    }
    .zh-prompt { font-size: 1.9rem; font-weight: 800; color: var(--text); margin: 4px 0 10px; }
    .mode-switch {
      display: inline-flex;
      background: #fdf2f8;
      border: 2px solid #f7cde0;
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 14px;
    }
    .mode-tab {
      padding: 8px 16px;
      min-height: 38px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 800;
      background: transparent;
      color: var(--muted);
    }
    .mode-tab.active {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      box-shadow: 0 4px 10px rgba(255, 111, 165, 0.25);
    }
    .letter-slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin: 12px 0 16px; }
    .slot {
      width: 36px;
      height: 44px;
      border-radius: 12px;
      border: 2.5px solid #e6c6da;
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--pink-dark);
      transition: all 0.14s ease;
    }
    .slot.filled { border-color: var(--pink); background: #fff0f6; transform: translateY(-2px); }
    .slot.space-slot { width: 18px; border-color: transparent; background: transparent; }
    .slot.symbol-slot { background: #faf5ff; border-color: #d8b4fe; color: var(--purple); }
    .type-input {
      width: 100%;
      max-width: 420px;
      padding: 13px 18px;
      font-size: 1.2rem;
      font-weight: 800;
      text-align: center;
      border-radius: 999px;
      border: 2.5px solid #e5b8d1;
      outline: none;
      color: var(--text);
      background: #fff;
      letter-spacing: 1px;
    }
    .type-input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255, 111, 165, 0.16); }
    .keypad { max-width: 560px; margin: 14px auto 0; display: flex; flex-direction: column; gap: 7px; user-select: none; }
    .key-row { display: flex; justify-content: center; gap: 6px; }
    .key-btn {
      flex: 1;
      max-width: 48px;
      min-width: 28px;
      height: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 12px;
      background: #fff8fc;
      border: 2px solid #f0cde0;
      color: var(--text);
      font-size: 1rem;
      font-weight: 800;
      box-shadow: 0 3px 0 #ebd0e0;
    }
    .key-btn:hover:not(:disabled) { background: #ffe6f2; border-color: var(--pink); }
    .key-btn.wide { max-width: 86px; font-size: 0.85rem; }
    .handwrite-wrap { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .canvas-box {
      position: relative;
      width: 100%;
      border: 3px solid #f0b8d4;
      border-radius: 22px;
      background: #fffdf9;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(180, 95, 145, 0.08);
      touch-action: none;
    }
    #write-canvas { display: block; width: 100%; height: 190px; cursor: crosshair; touch-action: none; }
    .ocr-status { font-size: 0.9rem; font-weight: 700; color: var(--purple); min-height: 22px; }
    .feedback-card { margin-top: 18px; padding: 16px; border-radius: 18px; text-align: left; display: none; }
    .feedback-card.show { display: block; }
    .feedback-card.ok { background: var(--success-bg); color: #14532d; border: 2px solid #86efac; }
    .feedback-card.err { background: var(--danger-bg); color: #881337; border: 2px solid #fda4af; }
    .wrong-box {
      border: 2px solid #fecdd3;
      background: #fff5f7;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #4a2c58;
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 700;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 60;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 560px) {
      .zh-prompt { font-size: 1.5rem; }
      .slot { width: 30px; height: 38px; font-size: 1.1rem; }
      .key-btn { height: 40px; min-height: 40px; font-size: 0.9rem; }
      .road-row.pos-left, .road-row.pos-right { justify-content: center; padding: 0; }
      .road-station { width: 100%; max-width: 340px; }
    }
  </style>
</head>

      off.width = srcCanvas.width; off.height = srcCanvas.height;
      const octx = off.getContext("2d"), dpr = window.devicePixelRatio || 1;
      octx.scale(dpr, dpr); octx.fillStyle = "#ffffff"; octx.fillRect(0, 0, off.width / dpr, off.height / dpr);
      octx.lineWidth = 6; octx.lineCap = "round"; octx.lineJoin = "round"; octx.strokeStyle = "#000000";
      for (const stroke of canvasStrokes) { if (!stroke.length) continue; octx.beginPath(); octx.moveTo(stroke[0].x, stroke[0].y); for (let i = 1; i < stroke.length; i++) octx.lineTo(stroke[i].x, stroke[i].y); octx.stroke(); }
      let detected = "";
      try { const worker = await ensureOcrWorker(); if (worker) { const res = await worker.recognize(off); detected = (res?.data?.text || "").replace(/[^a-zA-Z'\s-]/g, "").trim(); } } catch (e) {}
      state.recognizing = false; state.recognizedText = detected || "(無法辨識)"; state.typed = detected; submitAnswer(null);
    }
    function submitAnswer(e) {
      if (e) e.preventDefault(); if (state.submitted) return;
      const qWord = state.questions[state.qIndex], ok = checkAnswerMatch(state.typed, qWord.en);
      state.submitted = true; state.isCorrect = ok;
      if (!ok && !state.wrongWords.some((w) => w.id === qWord.id)) state.wrongWords.push(qWord);
      render(); speak(qWord.en);
    }
    function nextQuestion() {
      if (state.qIndex + 1 < state.questions.length) {
        state.qIndex += 1; state.typed = ""; state.recognizedText = ""; state.submitted = false; state.isCorrect = false; state.showHint = false;
        render(); afterQuizRender();
      } else if (state.wrongWords.length > 0) {
        state.view = "wrong_review"; render(); window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        if (!progress.passedPages.includes(state.page)) { progress.passedPages.push(state.page); saveProgress(); }
        state.view = "pass"; render(); window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }
    function renderSlotsHtml(targetEn, currentTyped) {
      const chars = Array.from(String(targetEn).replace(/\(UK\)|\(US\)/gi, "").trim()), typedChars = Array.from(currentTyped);
      let tIdx = 0;
      return chars.map((ch) => {
        if (ch === " ") { if (typedChars[tIdx] === " ") tIdx++; return `<span class="slot space-slot"></span>`; }
        const userChar = typedChars[tIdx] || ""; if (typedChars.length > tIdx) tIdx++;
        if (!/[a-zA-Z]/.test(ch)) return `<span class="slot symbol-slot">${esc(userChar || ch)}</span>`;
        return `<span class="slot ${userChar ? "filled" : ""}">${esc(userChar)}</span>`;
      }).join("");
    }
    function render() {
      const app = document.getElementById("app");
      if (!app) return;
      if (state.view === "map") app.innerHTML = renderMap();
      else if (state.view === "review") app.innerHTML = renderReview();
      else if (state.view === "quiz") app.innerHTML = renderQuiz();
      else if (state.view === "wrong_review") app.innerHTML = renderWrongReview();
      else if (state.view === "pass") app.innerHTML = renderPass();
    }
    function renderMap() {
      const levels = getLevels(), clearedCount = progress.passedPages.filter((p) => levels.some((l) => l.page === p)).length;
      const nextLv = levels.find((l) => !progress.passedPages.includes(l.page)) || levels[0];
      const pattern = ["pos-left", "pos-center", "pos-right", "pos-center"], icons = ["🌸", "🦄", "🍓", "🎀", "🍭", "🌈", "⭐", "🧁"], sceneries = ["🌷", "☁️", "🦋", "🍄", "✨", "🏰"];
      const rowHeight = 104, totalH = levels.length * rowHeight + 40;
      const getX = (idx) => pattern[idx % pattern.length] === "pos-left" ? 230 : pattern[idx % pattern.length] === "pos-right" ? 570 : 400;
      let pathD = "";
      levels.forEach((_, idx) => {
        const x = getX(idx), y = idx * rowHeight + 48;
        if (idx === 0) pathD += `M ${x} ${y}`;
        else { const px = getX(idx - 1), py = (idx - 1) * rowHeight + 48, my = (py + y) / 2; pathD += ` C ${px} ${my}, ${x} ${my}, ${x} ${y}`; }
      });
      return `
        <section class="card map-hero">
          <div><h1>🎀 夢幻單字闖關地圖（共 ${levels.length} 關）</h1><p>沿著彎彎曲曲的彩虹小路點選關卡 → <strong>先複習全部單字</strong> → <strong>打字或手寫拼英文</strong> → <strong>錯題反覆重測到全對！</strong></p></div>
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <div class="star-badge">⭐ 已收集星星：${clearedCount} / ${levels.length}</div>
            ${nextLv ? `<button class="btn-pink btn-sm" onclick="openReview(${nextLv.page})">出發去第 ${nextLv.page} 頁 →</button>` : ""}
          </div>
        </section>
        <section class="road-map-wrapper">
          <svg class="road-svg" viewBox="0 0 800 ${totalH}" preserveAspectRatio="none">
            <path d="${pathD}" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" />
            <path d="${pathD}" fill="none" stroke="#ffd1e6" stroke-width="34" stroke-linecap="round" />
            <path d="${pathD}" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="14 14" stroke-linecap="round" />
          </svg>
          <div class="road-nodes-list">
            ${levels.map((lv, idx) => {
              const posCls = pattern[idx % pattern.length], done = progress.passedPages.includes(lv.page), isNext = nextLv && nextLv.page === lv.page;
              return `<div class="road-row ${posCls}"><span class="scenery-deco" style="${posCls === "pos-left" ? "right:12%;" : "left:12%;"}">${sceneries[idx % sceneries.length]}</span>
                <div class="road-station ${done ? "cleared" : ""} ${isNext ? "next-target" : ""}" onclick="openReview(${lv.page})">
                  ${isNext ? `<div class="avatar-pin">👧🏻 目前在這裡！</div>` : ""}
                  <div class="station-circle"><span style="font-size:0.72rem;">PAGE</span><span>${lv.page}</span></div>
                  <div class="station-info"><div class="station-title">${icons[idx % icons.length]} 第 ${lv.page} 頁・${esc(lv.title)}</div><div class="station-meta">共 ${lv.words.length} 個單字 ・ ${done ? "✅ 已全對過關" : "點擊開始闖關"}</div></div>
                </div></div>`;
            }).join("")}
          </div>
        </section>`;
    }
    function renderReview() {
      const words = getWordsByPage(state.page), lv = getLevels().find((x) => x.page === state.page);
      return `<section class="card stage-top"><div><span class="step-pill">🌸 步驟 1：先複習第 ${state.page} 頁全部單字（共 ${words.length} 個）</span><h2 style="margin:4px 0;">第 ${state.page} 頁：${esc(lv ? lv.title : "")}</h2><div style="color:var(--muted); font-weight:600;">先看過中文與英文拼法、按「🔊 聽發音」，準備好就開始測驗！</div></div>
        <button class="btn-pink" onclick="startQuiz(${state.page})">複習好了，開始考全部 ${words.length} 題 →</button></section>
        <section class="review-grid">${words.map((w, i) => `<div class="vocab-card"><div><div style="font-size:0.8rem; color:var(--muted); font-weight:700;">#${i + 1}</div><div class="vocab-zh">${esc(w.zh)}</div><div class="vocab-en">${esc(w.en)}</div></div><button class="btn-soft btn-sm" onclick="speak('${escJs(w.en)}')">🔊 聽發音</button></div>`).join("")}</section>
        <div style="text-align:center;"><button class="btn-pink" onclick="startQuiz(${state.page})">開始考第 ${state.page} 頁全部 ${words.length} 個單字 →</button></div>`;
    }
    function renderQuiz() {
      const total = state.questions.length, word = state.questions[state.qIndex], pct = Math.round(((state.qIndex + (state.submitted ? 1 : 0)) / total) * 100);
      const rows = [["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L"],["Z","X","C","V","B","N","M","BACK"]];
      return `<section class="card quiz-center"><div class="stage-top"><button class="btn-soft btn-sm" onclick="openReview(${state.page})">← 回單字複習</button><div style="font-weight:800; color:var(--muted);">${state.roundNumber > 1 ? `🍭 錯題特訓第 ${state.roundNumber - 1} 輪` : `🎀 第 ${state.page} 頁測驗`}・第 ${state.qIndex + 1} / ${total} 題</div><button class="btn-soft btn-sm" onclick="state.showHint = !state.showHint; render(); afterQuizRender();">${state.showHint ? "🙈 隱藏提示" : "💡 小提示"}</button></div>
        <div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div>
        <div class="zh-prompt-box"><div style="font-size:0.88rem; color:var(--purple); font-weight:800;">請看中文，拼出英文單字！</div><div class="zh-prompt">${esc(word.zh)}</div><div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap;"><button type="button" class="btn-purple btn-sm" onclick="speak('${escJs(word.en)}')">🔊 聽發音</button></div>${state.showHint ? `<div style="font-size:0.92rem; color:var(--pink-dark); font-weight:800; margin-top:8px;">提示：開頭是「${esc(word.en.trim().charAt(0).toUpperCase())}」</div>` : ""}</div>
        <div class="mode-switch"><button type="button" class="mode-tab ${state.inputMode === "type" ? "active" : ""}" onclick="switchInputMode('type')">⌨️ 打字作答</button><button type="button" class="mode-tab ${state.inputMode === "write" ? "active" : ""}" onclick="switchInputMode('write')">✍️ 手寫作答</button></div>
        ${state.inputMode === "type" ? `<div id="slots-container" class="letter-slots">${renderSlotsHtml(word.en, state.typed)}</div><form onsubmit="submitAnswer(event)" style="display:flex; flex-direction:column; align-items:center; gap:12px;"><input id="answer-input" class="type-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在這裡輸入英文單字..." value="${esc(state.typed)}" ${state.submitted ? "disabled" : ""} oninput="handleInputChange(this.value)" />${!state.submitted ? `<button type="submit" class="btn-pink">送出答案 ✨</button>` : ""}</form>${!state.submitted ? `<div class="keypad">${rows.map((r) => `<div class="key-row">${r.map((k) => k === "BACK" ? `<button type="button" class="key-btn wide" onclick="pressKey('BACK')">⌫ 退格</button>` : `<button type="button" class="key-btn" onclick="pressKey('${k.toLowerCase()}')">${k}</button>`).join("")}</div>`).join("")}<div class="key-row"><button type="button" class="key-btn wide" style="max-width:160px;" onclick="pressKey('SPACE')">空白鍵</button></div></div>` : ""}` : `<div class="handwrite-wrap"><div class="canvas-box"><canvas id="write-canvas"></canvas></div><div id="ocr-status" class="ocr-status">${state.submitted ? `手寫辨識結果：<strong>${esc(state.recognizedText)}</strong>` : "請用手指、觸控筆或滑鼠在格子裡寫出英文單字 ✍️"}</div>${!state.submitted ? `<div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;"><button type="button" class="btn-soft btn-sm" onclick="clearCanvas()">🧹 清除重寫</button><button type="button" class="btn-pink" onclick="recognizeAndSubmitWriting()">辨認手寫並送出 ✨</button></div>` : ""}</div>`}
        <div class="feedback-card ${state.submitted ? "show " + (state.isCorrect ? "ok" : "err") : ""}">${state.submitted ? `<div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;"><div><div style="font-size:1.12rem; font-weight:800;">${state.isCorrect ? "🎉 答對了！拼得超棒！" : "🌷 差一點點！這題會加入錯題重測喔："}</div><div style="margin-top:4px; font-size:1.05rem;">正確英文：<strong>${esc(word.en)}</strong>（${esc(word.zh)}）${state.inputMode === "write" ? `<div style="font-size:0.88rem; opacity:0.85;">辨識到你寫的是：${esc(state.recognizedText)}</div>` : ""}</div></div><div style="display:flex; gap:8px;"><button type="button" class="btn-soft btn-sm" onclick="speak('${escJs(word.en)}')">🔊 再聽一次</button><button type="button" class="${state.isCorrect ? "btn-mint" : "btn-purple"} btn-sm" onclick="nextQuestion()">${state.qIndex + 1 < total ? "下一題 →" : "看本輪結果 →"}</button></div></div>` : ""}</div></section>`;
    }
    function renderWrongReview() {
      return `<section class="card"><span class="step-pill" style="background:var(--warning-bg); color:#b45309; border-color:#fcd34d;">🍓 錯題特訓循環・直到全對才過關</span><h2 style="margin:6px 0;">這輪還有 ${state.wrongWords.length} 個單字答錯，先複習再重做一次！</h2><p style="color:var(--muted); font-weight:600;">把下面錯的單字拼法看熟、按「🔊 聽發音」，接著按「開始重做錯題」。如果重做時還有錯，會繼續針對錯題重做，直到全部答對才算通過！</p>${state.wrongWords.map((w) => `<div class="wrong-box"><div><div style="font-size:1rem; font-weight:700;">${esc(w.zh)}</div><div style="font-size:1.3rem; font-weight:800; color:var(--danger);">${esc(w.en)}</div></div><button class="btn-soft btn-sm" onclick="speak('${escJs(w.en)}')">🔊 聽發音</button></div>`).join("")}<button class="btn-pink" style="margin-top:12px;" onclick="startQuiz(state.page, state.wrongWords, state.roundNumber + 1)">開始重做這 ${state.wrongWords.length} 個錯題 →</button></section>`;
    }
    function renderPass() {
      const levels = getLevels(), idx = levels.findIndex((l) => l.page === state.page), nextLv = idx >= 0 && idx + 1 < levels.length ? levels[idx + 1] : null;
      return `<section class="card" style="text-align:center; padding:34px 18px; background:linear-gradient(135deg, #fff5fa 0%, #f0fff7 100%);"><div style="font-size:2.6rem;">👑⭐🎉</div><h2 style="margin:8px 0; color:#15803d;">太厲害了！第 ${state.page} 頁全對通過！</h2><p style="color:var(--muted); font-weight:600; margin:0 0 22px;">這一頁的所有單字都完全答對囉，星星已點亮！</p><div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">${nextLv ? `<button class="btn-pink" onclick="openReview(${nextLv.page})">沿著地圖前往下一關：第 ${nextLv.page} 頁 →</button>` : ""}<button class="btn-soft" onclick="goMap()">🗺️ 回闖關地圖看進度</button></div></section>`;
    }
    function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function escJs(s) { return String(s ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, " "); }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", render);
    } else {
      render();
    }
  </script>
</body>
</html>
